# 内容引擎服务配置（DocEngine）
# 服务注册：@BladeCloudApplication 经 Nacos 自动注册（应用名 blade-doc）
# 数据源：由 Nacos blade-doc-{env}.yaml 提供 spring.datasource.*（标准 Druid 自动配置）
# 网关路由：/blade-doc/** -> lb://blade-doc（配于 Nacos blade-gateway-{env}.yaml）

blade:
  doc:
    # 上传大小限制（MB），对齐 E9 SecCategoryComInfo 缺省 5MB（后续按目录级 maxUploadFileSize 覆盖）
    max-upload-size: 5
    # 内容/回调 URL 签名（加固 DOC-P0-4，见 DocUrlSigner）；生产必须由 Nacos 覆盖为高熵值
    url-sign-secret: doc-dev-secret-change-me
    url-sign-ttl-seconds: 300
    # WPS 接入配置（app-id/app-secret/jssdk-url/public-base/sign-secret）统一由
    # 「编辑器设置」页面写入 doc_engine_setting 库表，经 WpsSettingsResolver 下发；
    # 此处不再维护明文凭证（历史默认值已在仓库泄露，见 P3.2 密钥轮换）。
    # 库表全空时由 WpsProperties 的 POJO 默认值兜底，此时 WPS 方案自动不可用。
  # DataScope：显式排除框架 FlowMapper，避免无数据权限配置时 DataScopeCache 对 null 调 getResourceCode() NPE
  data-scope:
    mapper-exclude:
      - FlowMapper
  # 租户隔离：doc_* 表白名单（对齐 blade-system 的 blade.tenant.tables 机制；缺此配置则 tenant_id 不被填充/过滤）
  tenant:
    column: tenant_id
    tables:
      - doc_detail
      - doc_sec_category
      - doc_image_file
      - doc_detail_content
      - doc_share
      - doc_dummy_detail
      - doc_detail_log
      - download_log
      - doc_recycle
      - doc_custom_field
      - doc_custom_field_value
      - doc_mould
      - doc_sec_category_coder
      - doc_sec_category_doc_property
      - doc_sec_category_approve_wf_detail
      - doc_reply
      - doc_praise
      - doc_score

  # WPS 统一改造共享配置（blade.wps.*）已全部迁入 doc_engine_setting 库表：
  # 由「编辑器设置」页面统一维护，blade-doc / blade-workflow 两侧经 WpsSettingsResolver 共用。
  # 本文件与 workflow 的 application-dev.yml 均不再维护任何 WPS 凭证/URL 明文，
  # 避免「改一处漏两处」；库表全空时 WpsProperties 的 POJO 默认值兜底（WPS 自动不可用）。
  # callback 安全开关仍由 WpsProperties 启动期默认值控制，刻意不经页面暴露。
