#服务器端口
server:
  port: 8111

#数据源配置
spring:
  datasource:
    url: ${blade.datasource.dev.url}
    username: ${blade.datasource.dev.username}
    password: ${blade.datasource.dev.password}

# 节点超时规则读源：BPMN wf:timeout 扩展（与 operator-from-bpmn 同向收敛，避免
# retirement 禁 wf_node_timeout 表读后规则双源都不可达）。扫描周期 dev 调快便于联调。
blade:
  workflow:
    timeout-from-bpmn:
      enabled: true
    timeout-scan-ms: 10000
    # P3-6 超时扫描源已切 ACT_RU_TASK.DUE_DATE_，而该列由任务双写收口器(WfTaskActWriter)填充；
    # 双写默认关会导致真实待办永远不被超时扫描命中。联调/运行必须开启（与扫描源强耦合）。
    task-act-write:
      enabled: true

