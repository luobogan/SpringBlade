## 审批流程服务配置（PoC）
#server:
#  port: 8111
#
## Flowable 引擎由 org.springblade.workflow.config.FlowableConfig 显式装配，
## 绑定主数据源并自动部署 classpath:processes/ 下的 BPMN 定义；
## 此处无需 spring.flowable.* 自动配置属性。
##
## 数据源（PoC 验证用，正式环境应由 Nacos blade-workflow-dev.yaml 提供）：
## 本版 SpringBlade 各服务数据源写在各自的 Nacos blade-{name}-dev.yaml 中，
## 标准 Druid 自动配置读取 spring.datasource.* 创建 DataSource。
#spring:
#  datasource:
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql://localhost:3306/blade_workflow?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
#    username: root
#    password: 123456
#
#blade:
#  api:
#    name: workflow
#    version: 1.0.0



# #服务器端口
# server:
#   port: ${blade.workflow.port:8111}

# #数据源配置（从Nacos读取，修改blade.yaml即可）
# spring:
#   datasource:
#     url: ${blade.datasource.dev.url}
#     username: ${blade.datasource.dev.username}
#     password: ${blade.datasource.dev.password}
#     driver-class-name: com.mysql.cj.jdbc.Driver

# Flowable ACT_* 表结构策略：true=启动时按版本自动升级（自愈 schema 漂移，仅缺失时建表）。
# 若不显式配置，FlowableConfig 的 @Value 默认值也是 true。
# 流程模板内部表（节点/操作者/出口）属于流程定义的一部分，不按部门做数据权限。
# 这些 mapper 的 selectList 等方法名含 "list"，会被 DataScopeInterceptor 默认拦截，
# 但库中没有对应数据权限配置，导致 DataScopeCache 对 null 调 getResourceCode() 抛 NPE。
# 这里显式排除（保留框架默认的 FlowMapper 排除项）。若其它 *Mapper 的 list/page 方法
# 也出现同样的 500，请把对应 Mapper 短名加入此列表（或加一个共同前缀如 "Wf"）。
blade:
  flowable:
    database-schema-update: true
  workflow:
    # 待办/已办读源（注意：是【直接值】，不是 .enabled —— WfTaskActReader 读 ${blade.workflow.task-read-source}）：
    #   wf  = wf_task（默认，零行为变化）
    #   act = ACT_RU_TASK / ACT_HI_TASKINST（去 wf_ 表）
    # 翻 act 前必须满足 doc/md/去wf_表-任务读源翻源上线检查.md 的达标阈值；
    # 读源=act 时对 ACT 表达不了的行（存量 N:1 会签 / 孤儿 / 合成待办）自动兜底合并 wf_task 保证【零丢单】；
    # 读取异常同样自动降级回 wf_task。回退改回 wf 并重启即可。
    # dev 验证已完成（18/28 与基线一致、操作链路正常），现【改回 wf】，原因见下行注释。
    # 为什么不留在 act：dev 数据不满足达标阈值（①N:1=137、⑦孤儿=344、覆盖率仅约 30%），
    #   139 条真实列表行里 108 条是存量 N:1 会签（ACT 单行表达不了），翻 act 后几乎全靠
    #   「兜底合并」回读 wf_task —— 名义上读 ACT、实际仍绕回 wf_task，既没真正翻源，
    #   又会掩盖真实覆盖率缺口，不利于观察。故回到诚实默认 wf，等预发/生产数据达标
    #   （N:1→0、孤儿→0 或全测试态、ACT可读≥99%）再翻 act。
    # 2026-09-30 已达标翻 act：活跃 N:1=0（代审清零+硬删 397 行 N:1 历史+344 行测试孤儿）、
    #   多算=0（admin ACT 17 = blade 17+1 合成）、⑤=0、⑥=0、⑦=0；新实例全部走 MI 1:1 + 双写。
    task-read-source: act
    task-act-write:
      # 任务业务列双写 ACT_RU_TASK / ACT_HI_TASKINST（去 wf_ 表 P4/P5 写侧）。
      # 依赖 doc/sql/migration/act_add_task_biz_columns.sql 已执行的 6 个自定义列（已执行）。
      # 与 wf_task 并存双写、互为校验；待读源切到 act 并验证无误后，才退役 wf_task。
      # 写失败仅告警不阻断主流程；会签 N:1（同一引擎任务多人）由写入器内建守卫跳过。
      enabled: true
    # 实例/审批日志读源（WfApprovalLogActReader 消费，默认 wf）：
    #   act = 台账/mine/getByBiz 读 ACT_HI_PROCINST；logs/node-operators 读 ACT_HI_COMMENT。
    # 2026-09-30 翻 act：ACT_HI_PROCINST 业务列 34/35 回填完整（1 个孤儿引擎实例置 CANCELED 不可见）；
    #   历史评论已回填（act_backfill_approval_comment.sql，132 条，活跃实例覆盖 100%）；
    #   写侧修复：WfTaskServiceImpl.appendLog 收敛到 WfWriteHelper（此前绕过双写致 ACT_HI_COMMENT 恒空）。
    instance-read-source: act
    instance-act-write:
      # 实例业务列「写回 ACT_HI_PROCINST」双写开关（WfInstanceActWriter，默认 false）。
      # ⚠️ 是 instance-read-source=act 的【硬前置】：不开则新实例业务列全空，
      # act 读源下新建实例会「流程实例不存在」（实测 77 条压测实例踩坑）。
      enabled: true
    # 审批意见双写 ACT_HI_COMMENT 开关（WfWriteHelper，默认 true）。
    # 本开关是 P6 停写 wf_approval_log 的【硬前置】：关掉后 ACT 无意见数据，
    # 读源=act 下会整页丢审批意见。P6 翻源前必须保持 true。
    approval-comment:
      enabled: true
    # P6「停写 wf_approval_log」开关（退役 wf_approval_log 读源）。
    #   true  = 双写（默认，零行为变化）：正常审批意见同时落 wf_approval_log 与 ACT_HI_COMMENT。
    #   false = 去冗余写：ACT 已落账的正常意见不再写 wf_approval_log；仅「ACT 写不进」的
    #           归档/挂起意见仍保留 wf 一行作读源=act 的兜底填充（避免丢单，见 WfApprovalLogActReader）。
    # ⚠️ 关闭后缺口填充行仍写入，绝不可整体停写；且须 instance-read-source=act 已生效。
    #   dev 已翻 false 进入 P6 验证：新审批意见只落 ACT_HI_COMMENT，wf_approval_log 仅留缺口填充行；
    #   读侧经 WfApprovalLogActReader 兜底合并仍完整（对应回归 WfP6StopWriteLogTest）。
    #   预发/生产回退只需改回 true 即恢复双写。
    approval-log-write:
      enabled: false
    comment-tenant-write:
      # D8（2026-10-01 拍板）：审批意见写侧落租户 —— 意见写入 ACT_HI_COMMENT 后，
      # 由 WfCommentTenantWriter 从 ACT_HI_PROCINST.TENANT_ID_ 反查回填 TENANT_ID_ 列，
      # 支撑「按租户横扫审批意见」不再 JOIN 实例表（既有按 PROC_INST_ID_ 的查询不受影响）。
      # 前置：先执行 doc/sql/migration/act_add_comment_tenant.sql（加列 + 索引 + 幂等回填）；
      #       列未建时回填失败被兜底吞掉（debug 日志），由脚本幂等回填补齐。
      # 注：Nacos blade-workflow-dev.yaml 若配了该键以 Nacos 为准（届时需同步）。
      enabled: true
    engine-multi-instance:
      # 会签/或签/依次下沉引擎多实例总开关（去 wf_ 表：让「1 引擎任务 = 1 人」，解锁待办/已办读源=act）。
      # 前置条件（代码均已实现）：① 部署期注入 multiInstanceLoopCharacteristics；
      #   ② doApprove 的 isEngineMultiInstance 守卫跳过自研计数；③ injectMiCollectionVars 注入集合变量。
      # ⚠️ 仅改本开关【不会】改写已部署定义，必须再调 POST /definition/admin/redeploy-mi 重新部署才对新建实例生效。
      # ⚠️ 在途实例不受影响（Flowable 绑定创建时的流程定义版本），回退改回 false 即可。
      enabled: true
    ledger-listener:
      # 方案C 总开关（《工作流双写漂移治理-方案C-事件驱动落地设计.md》§6/§7，进度见 §10）。
      # 当前阶段：阶段 3「切单写」已完成并回归通过（见文档 §10.6）。
      #
      # true  = 注册 WfEngineEventListener，台账状态由【引擎事件反写】驱动（C1 强一致，isFailOnException=true）；
      #         业务侧 WfWriteHelper 不再显式写 wf_instance.status / 关闭 wf_task，只写 intent 并由事件落地。
      # false = 完全回到方案A 显式双写：业务侧 eventDriven() 返回 false，恢复 setStatus+updateById
      #         与关闭待办循环。无需改代码、无需修数据 —— 这是方案C 的【回退路径】。
      #
      # 注意：若 Nacos blade-workflow-dev.yaml 也配置了该键，以 Nacos 为准（届时需在 Nacos 侧同步修改）。
      # 回退路径验证已通过（2026-09-27）：enabled=false 时 WfWriteHelper 兜底显式写可独立撑住状态。
      # 现恢复 true，处于阶段 3「切单写」生效状态。
      enabled: true
    definition-from-bpmn:
      # 定义读源总开关（去 wf_ 表 P3-5：一个 key 管四处消费方：definition/task/③reject/WfInstanceServiceImpl）。
      # 本文件置 true；若 Nacos blade-workflow-dev.yaml 也配了该键，以 Nacos 为准（届时需在 Nacos 侧同步）。
      #   ① /definition/{id}/nodes|links（loadNodes/loadLinks，读 BPMN wf:node + wf:link + wf:foldedLink）；
      #   ② 运行期 loadNode()（doApprove/转办/抄送/列表节点名）；
      #   ③ 退回可达性 WfRejectManager（/task/{id}/reject-nodes + reject 目标校验）。
      # 锚定 def 自己的部署 proc_def_id：草稿/未部署（procDefId 为空）自动回退 wf_process_node/wf_node_link，
      # 读取异常同样降级；deploy 条件注入/saveBpmn/另存版本/simulate/diff 等内部写路径固定仍读 wf_* 表。
      enabled: true
    # T-10 孤立缺口闭环：渲染层（/form/render、/form/preview）节点配置读源开关，与上方定义期总开关解耦。
    # 仅影响 render/preview 的操作菜单/签字意见/打印设置/意见显示读取；不牵动 /definition/nodes、/definition/links、reject。
    # 开启时读 BPMN wf:node 扩展，草稿/未部署/缺扩展自动回退 wf_process_node（与 nodes/reject 同源）。
    # 默认 false（零行为变化）；翻转后仅 render/preview 走 BPMN，其余按定义期总开关走。
    # 注：Nacos blade-workflow-dev.yaml 若配了该键以 Nacos 为准（届时需同步）。
    render-node-from-bpmn:
      enabled: true
    # T-14（决策 B · 2026-10-01）：运行期去依赖、表保留——放弃 DROP。
    # 经全量 Mapper 读写盘点，wf_process_node/link/operator/timeout/field_perm/detail_perm/detail_filter/approval_log
    # 仍被设计期 store（WfDefinitionServiceImpl）、节点测试（WfTestServiceImpl）、回填桥（WfDefinitionBackfillJob）、
    # 运行期直读（节点名 tooltip / 多实例判定与集合注入 / NodeActionExecutor）直接主用读写；
    # 仅闸控「回退分支」不足以 DROP（翻转+DROP 会让 wf_process_node 变空 → 多实例失效、测试/编辑出错）。
    # 故本期仅做到「运行期读源不再静默回退 wf_*」，wf_* 表作为遗留设计期镜像/测试存储长期保留，不 DROP。
    # 主开关默认 false（零行为变化、可回滚）：运行期仍允许「BPMN 读到空 → 回退 wf_*」的兼容行为。
    # 翻转 true 时（可选加固，非退役）：禁用回退分支——BPMN/ACT 读空即按空/报错，不再触碰 wf_* 回退读；
    #   wf_task/wf_instance 双写、wf_approval_log 合并（mergeMissingFromWf）一并禁用。
    #   注意：开关只闸控「回退」分支，设计期 store / 节点测试 / 回填桥对 wf_* 的直接读写不受影响（表仍被写）。
    # 前置（翻转 true 时）：草稿/未部署定义必须先部署再发起（前端保证）。
    # 注：Nacos blade-workflow-dev.yaml 若配了该键以 Nacos 为准（届时需同步）。
    wf-table-retirement:
      enabled: true
    # T-11（P3-5）：定义期读源从 wf_* 表切到 BPMN wf: 扩展。
    # 前置：① BPMN 已回填/前端已保存对应扩展；② 回归测试通过（WfBpmn*SwitchTest / RoundTripTest）。
    # 回退：改回 false 并重启即回到 wf_* 读源（扩展只增不删，回退不影响数据）。
    # 安全护栏（2026-10-01 补）：消费方（WfPermServiceImpl / WfOperatorResolver / WfTimeoutServiceImpl）
    #   采用「逐节点 BPMN 读到空即回退 wf_* 表」策略——草稿/缺扩展/缺子元素都不会静默降级为零权限/零操作者/零超时。
    #   findUserTask 已锚定 def 自身部署（resolveOwnProcDefId），杜绝跨 def 串数据
    #   （dev 实测：草稿定义翻转 perm 曾静默降级为零权限，已根治）。
    # 2026-10-01 已翻转：dev 实测数据覆盖情况如下 ——
    #   detail-perm / detail-filter / timeout：dev 库【0 行】数据、BPMN 亦无对应扩展
    #     ⇒ 翻转后两侧均为空，属零行为变化（先行翻转，为后续有数据时铺路）；
    #   perm（字段权限）：dev 有 96 行 wf_node_field_perm、3 个定义带 wf:fieldPerm
    #     ⇒ 翻转后由护栏保证「草稿定义回退 wf_node_field_perm、已部署完整定义读 BPMN」，
    #        不再出现无差别降级为零的问题（已实地比对：草稿 2104053607105081345 回退 DB 5/4 条、
    #        已部署 2104056294928363521 走 BPMN 值一致）；
    #   operator（节点操作者）：backfill 已回填 wf:operator 且带 reconcile 对账（BPMN 与 DB 等价），
    #     ⇒ 翻转后流转期 WfOperatorResolver 读 BPMN，草稿/缺扩展回退 wf_node_operator。
    detail-perm-from-bpmn:
      enabled: true
    detail-filter-from-bpmn:
      enabled: true
    timeout-from-bpmn:
      enabled: true
    perm-from-bpmn:
      enabled: true
    operator-from-bpmn:
      enabled: true
  data-scope:
    mapper-exclude:
      - FlowMapper
      - WfNodeOperatorMapper
      - WfProcessNodeMapper
      - WfNodeLinkMapper
      - WfProcessDefinitionMapper
      - WfNodeFieldPermMapper
      - WfNodeDetailPermMapper
      - WfCustomActionMapper
