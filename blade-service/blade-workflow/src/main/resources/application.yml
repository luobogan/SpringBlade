## 审批流程服务配置（PoC）
#server:
#  port: 8111
#
## Flowable 引擎由 org.springblade.workflow.config.FlowableConfig 显式装配，
## 绑定主数据源并自动部署 classpath:processes/ 下的 BPMN 定义；
## 此处无需 spring.flowable.* 自动配置属性。
##
## 数据源（PoC 验证用，正式环境应由 Nacos blade-workflow-dev.yaml 提供）：
## 本版 SpringBlade 各服务数据源写在各自的 Nacos blade-{name}-dev.yaml 中，
## 标准 Druid 自动配置读取 spring.datasource.* 创建 DataSource。
#spring:
#  datasource:
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql://localhost:3306/blade_workflow?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
#    username: root
#    password: 123456
#
#blade:
#  api:
#    name: workflow
#    version: 1.0.0



# #服务器端口
# server:
#   port: ${blade.workflow.port:8111}

# #数据源配置（从Nacos读取，修改blade.yaml即可）
# spring:
#   datasource:
#     url: ${blade.datasource.dev.url}
#     username: ${blade.datasource.dev.username}
#     password: ${blade.datasource.dev.password}
#     driver-class-name: com.mysql.cj.jdbc.Driver

# Flowable ACT_* 表结构策略：true=启动时按版本自动升级（自愈 schema 漂移，仅缺失时建表）。
# 若不显式配置，FlowableConfig 的 @Value 默认值也是 true。
# 流程模板内部表（节点/操作者/出口）属于流程定义的一部分，不按部门做数据权限。
# 这些 mapper 的 selectList 等方法名含 "list"，会被 DataScopeInterceptor 默认拦截，
# 但库中没有对应数据权限配置，导致 DataScopeCache 对 null 调 getResourceCode() 抛 NPE。
# 这里显式排除（保留框架默认的 FlowMapper 排除项）。若其它 *Mapper 的 list/page 方法
# 也出现同样的 500，请把对应 Mapper 短名加入此列表（或加一个共同前缀如 "Wf"）。
blade:
  flowable:
    database-schema-update: true
  workflow:
    task-act-write:
      # 任务业务列双写 ACT_RU_TASK / ACT_HI_TASKINST（去 wf_ 表 P4/P5 写侧）。
      # 依赖 doc/sql/migration/act_add_task_biz_columns.sql 已执行的 6 个自定义列（已执行）。
      # 与 wf_task 并存双写、互为校验；待读源切到 act 并验证无误后，才退役 wf_task。
      # 写失败仅告警不阻断主流程；会签 N:1（同一引擎任务多人）由写入器内建守卫跳过。
      enabled: true
    engine-multi-instance:
      # 会签/或签/依次下沉引擎多实例总开关（去 wf_ 表：让「1 引擎任务 = 1 人」，解锁待办/已办读源=act）。
      # 前置条件（代码均已实现）：① 部署期注入 multiInstanceLoopCharacteristics；
      #   ② doApprove 的 isEngineMultiInstance 守卫跳过自研计数；③ injectMiCollectionVars 注入集合变量。
      # ⚠️ 仅改本开关【不会】改写已部署定义，必须再调 POST /definition/admin/redeploy-mi 重新部署才对新建实例生效。
      # ⚠️ 在途实例不受影响（Flowable 绑定创建时的流程定义版本），回退改回 false 即可。
      enabled: true
    ledger-listener:
      # 方案C 总开关（《工作流双写漂移治理-方案C-事件驱动落地设计.md》§6/§7，进度见 §10）。
      # 当前阶段：阶段 3「切单写」已完成并回归通过（见文档 §10.6）。
      #
      # true  = 注册 WfEngineEventListener，台账状态由【引擎事件反写】驱动（C1 强一致，isFailOnException=true）；
      #         业务侧 WfWriteHelper 不再显式写 wf_instance.status / 关闭 wf_task，只写 intent 并由事件落地。
      # false = 完全回到方案A 显式双写：业务侧 eventDriven() 返回 false，恢复 setStatus+updateById
      #         与关闭待办循环。无需改代码、无需修数据 —— 这是方案C 的【回退路径】。
      #
      # 注意：若 Nacos blade-workflow-dev.yaml 也配置了该键，以 Nacos 为准（届时需在 Nacos 侧同步修改）。
      # 回退路径验证已通过（2026-09-27）：enabled=false 时 WfWriteHelper 兜底显式写可独立撑住状态。
      # 现恢复 true，处于阶段 3「切单写」生效状态。
      enabled: true
  data-scope:
    mapper-exclude:
      - FlowMapper
      - WfNodeOperatorMapper
      - WfProcessNodeMapper
      - WfNodeLinkMapper
      - WfProcessDefinitionMapper
      - WfNodeFieldPermMapper
      - WfNodeDetailPermMapper
      - WfCustomActionMapper
