## 审批流程服务配置（PoC）
#server:
#  port: 8111
#
## Flowable 引擎由 org.springblade.workflow.config.FlowableConfig 显式装配，
## 绑定主数据源并自动部署 classpath:processes/ 下的 BPMN 定义；
## 此处无需 spring.flowable.* 自动配置属性。
##
## 数据源（PoC 验证用，正式环境应由 Nacos blade-workflow-dev.yaml 提供）：
## 本版 SpringBlade 各服务数据源写在各自的 Nacos blade-{name}-dev.yaml 中，
## 标准 Druid 自动配置读取 spring.datasource.* 创建 DataSource。
